apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: visr-reconstruction
  labels:
    workflows.diamond.ac.uk/science-group-examples: "true"
  annotations:
    workflows.argoproj.io/title: visr-reconstruction
    workflows.argoproj.io/description: |
      Image Reconstruction for the Visible Light Spectroscopy beamline (ViSR).
    workflows.diamond.ac.uk/repository: "https://github.com/DiamondLightSource/test-rig-workflows"
spec:
  entrypoint: visr-reconstruction
  arguments:
    parameters:
      - name: scan_file
        value: "b01-1-361"
      - name: data-collection-dir
        value: /dls/b01-1/data/2025/cm40661-6
  volumes:
    - name: session
      hostPath:
        path: "{{`{{ workflow.parameters.data-collection-dir }}`}}"
        type: Directory
    - name: temp-directory
      emptyDir: {}
  templates:
    - name: visr-reconstruction
      container:
        image: ghcr.io/diamondlightsource/visr-reconstruction:latest
        command: [visr-reconstruction]
        env:
          - name: MPLCONFIGDIR
            value: /tmp
        args:
          - "--output"
          - "/tmp/visr-reconstructed-image.png"
          - "{{`{{workflow.parameters.data-collection-dir}}`}}/{{`{{workflow.parameters.scan_file}}`}}.nxs"
        volumeMounts:
          - name: session
            mountPath: "{{`{{ workflow.parameters.data-collection-dir }}`}}"
          - name: temp-directory
            mountPath: /tmp
      outputs:
        artifacts:
          - name: visr-reconstructed-image
            path: /tmp/visr-reconstructed-image.png
            archive:
              none: {}
